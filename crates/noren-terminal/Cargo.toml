[package]
name = "noren-terminal"
description = "Noren-owned terminal state, cell-width, and bounded snapshot contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
unicode-width.workspace = true

[features]
# Empty by design: a compile gate for the `benches/` targets so `cargo
# test --workspace` (and CI) never builds the bench harness. Run with
# `cargo bench -p noren-terminal --features bench-support`.
bench-support = []

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "feed_bytes"
harness = false
required-features = ["bench-support"]

[lints]
workspace = true

# Report-only benchmark (issue #172). `harness = false` with no benching
# dependency; `test = false` keeps `cargo test --workspace` from running the
# timing loop as if it were a test.
[[bench]]
name = "snapshot_scrollback"
harness = false
test = false
