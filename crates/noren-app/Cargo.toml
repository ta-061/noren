[package]
name = "noren-app"
description = "macOS entry point, app-owned event adapter, and bounded wiring for the local-PTY PoC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
noren-pty.workspace = true
noren-terminal.workspace = true
toml_edit.workspace = true
winit.workspace = true
wgpu.workspace = true
# Not a real dependency: the bench harness, optional for the reasons
# recorded in `crates/noren-terminal/Cargo.toml`.
criterion = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# `OpenOptionsExt` accepts custom flags but std does not expose their portable
# values. Use libc's target definitions without calling any unsafe APIs.
libc.workspace = true

[features]
test-support = []
# Compile gate for the `benches/` targets and their harness; see the
# matching comment in `crates/noren-terminal/Cargo.toml` for why the
# harness is an optional normal dependency rather than a dev-dependency.
# Run with `cargo bench -p noren-app --features bench-support`.
bench-support = ["dep:criterion"]

[dev-dependencies]
# Self-dev-dependency so integration tests (separate crates) can reach the
# `test-support`-gated `sidebar::fixtures` module without shipping it in
# release builds.
noren-app = { path = ".", features = ["test-support"] }
# Test-only exception to "no PTY backend types at the app layer": the live
# Zellij harness (`tests/zellij_live.rs`) spawns an installed Zellij in the
# same PTY backend `noren-pty` uses, because the product crate's launch
# policy is deliberately fixed to `/bin/zsh`. The harness takes TERM and
# TERM_PROGRAM from `noren_pty`'s real `LaunchMetadata` so it cannot drift
# from the production environment policy.
portable-pty.workspace = true

[[bench]]
name = "ssh_config"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "renderer_frame"
harness = false
required-features = ["bench-support"]

[lints]
workspace = true
