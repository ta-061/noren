name: Rust

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint, and test (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record pinned toolchain and host environment
        # rust-toolchain.toml is honored directly by rustup; no floating Rust
        # setup action is used. This records the exact ADR 0001 evidence.
        run: |
          set -x
          rustc --version --verbose
          cargo --version --verbose
          rustup toolchain list
          rustup target list --installed
          uname -m
          uname -a
          sw_vers
      - name: Check for whitespace errors in the change
        run: git --no-pager diff --check ${{ github.event.pull_request.base.sha }} HEAD
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Bench targets and the criterion harness sit behind the optional
      # `bench-support` feature, so the steps above (test/clippy without
      # features) never compile them. This additive step is the only place
      # the bench code is linted, so it cannot drift into warnings between
      # bench runs.
      - name: Clippy benchmarks (bench-support feature)
        run: cargo clippy --workspace --all-targets --features noren-terminal/bench-support,noren-app/bench-support -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace
      - name: Documentation checks
        run: python3 scripts/check_docs.py
      - name: Documentation checker regression tests
        run: python3 -m unittest scripts/test_check_docs.py
      - name: Release-notes generator regression tests
        run: python3 -m unittest scripts/test_generate_notes.py
