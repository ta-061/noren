[workspace]
resolver = "3"
members = [
    "crates/noren-pty",
    "crates/noren-terminal",
    "crates/noren-app",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ta-061/noren"
publish = false

# Noren baseline policy: no hand-written `unsafe` in the PoC crates. Candidate
# libraries are compiled and reviewed independently; this deny does not audit
# their internals.
[workspace.lints.rust]
unsafe_code = "deny"

# Exact candidate versions live in one place so a later replacement or upgrade
# is a single reviewed change. The `=` pins are intentional: ADR 0001 records
# these as the measured PoC candidates, not floating ranges.
[workspace.dependencies]
libc = { version = "=0.2.189" }
portable-pty = { version = "=0.9.0" }
# Already resolved transitively in the lockfile; the app crate reads the
# optional configuration file with it. Parsing only: default features are
# disabled so the writer crate never enters the dependency graph.
toml_edit = { version = "=0.25.13", default-features = false, features = ["parse"] }
unicode-width = { version = "=0.2.2" }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "metal", "wgsl"] }
noren-pty = { path = "crates/noren-pty" }
noren-terminal = { path = "crates/noren-terminal" }
# Bench harness for the M7 quality slice. Listed here because workspace
# inheritance has one shared table. It is consumed only as a member's
# *optional* dependency behind the member's non-default `bench-support`
# feature, so it never enters a shipped build graph — and, unlike a plain
# dev-dependency, never enters a `cargo test` build either: `required-
# features` on the bench targets filters targets, not the dev-dep graph,
# and an unconditional dev-dependency entry cost a measured +3.8 s of
# cold `cargo test` compile time on the reference M4 before it was moved.
# Pinned `=` per the policy above: recorded baselines are only comparable
# when the harness cannot drift. Only `cargo_bench_support` is enabled —
# no rayon, plotters, or HTML reports — keeping the bench-only compile
# cost small.
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
